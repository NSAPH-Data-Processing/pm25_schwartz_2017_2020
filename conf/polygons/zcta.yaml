polygon_name: zcta

# Raw publisher artefacts. Paths are relative to {base_path}/raw/polygons/ —
# folders generated by create_dir_paths are guaranteed to exist and are not
# repeated in config.
#
# Schwartz ships TIGER/Census ZCTA shapefiles per data year; the `zcta` column
# has already been canonicalised upstream of this pipeline (publisher's original
# was GEOID10 / ZCTA5CE10 / GEOID20). The pipeline therefore only needs to (a)
# locate the raw .shp per vintage and (b) convert to .gpkg in target_crs.
raw:
  filename_pattern: us_shapefile__census__zcta_yearly__{vintage}/us_shapefile__census__zcta_yearly__{vintage}.shp
  id_column: zcta            # publisher's name for the polygon ID column; already canonical here
  # origin_crs is inferred from the raw shapefile's declared CRS (.prj file).

# Standardised inputs produced by standardize_polygons.py.
input:
  target_crs: 4326           # WGS84 — canonical SpaceAgg polygon CRS (DD-10)

# Vintage selection policy: exact | nearest_below (DD-10). For Schwartz with
# annual TIGER releases matching data years 2017–2020 1:1, `exact` is correct.
vintage_policy: exact

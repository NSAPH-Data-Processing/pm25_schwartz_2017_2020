temporal_freq: daily

# Variable map (DD-15): keyed by the SpaceAgg-standardised name. Each entry
# carries the publisher's raw zip + per-day filename patterns for this cadence.
# `zip:` is the path to the monthly zip archive; `file:` is the path INSIDE the
# zip (also relative to {base_path}/raw/grids/ after extraction).
variables:
  pm25:
    zip:  daily-dat/PM25-{year}-{month}.zip
    file: daily-dat/PM25-{year}-{month}/PM25-{year}-{month}-{day}.dat

raw:
  grid:
    # origin_crs is inferred from the raw file's declared CRS (DD-14).
    filename: grid.gpkg

# Standardised inputs. Case C per DD-9 / skills/crs.md (centroids in 4326,
# unknown projected CRS): stay in 4326 with regular degree pixel size + resample.
input:
  grid:
    target_crs: 4326
    cell_size: 0.008333         # 1/120° (unit = target_crs's; degrees here, metres if projected)
    bounds:                     # Case C requires explicit bounds (snapped to whole degrees enclosing CONUS).
      xmin: -125.0
      ymin: 24.0
      xmax: -66.0
      ymax: 50.0
    tif:
      dtype: float32
      nodata: nan
      compression: lzw
      tiled: true
      blockxsize: 256
      blockysize: 256

resample: true
resample_method: nearest

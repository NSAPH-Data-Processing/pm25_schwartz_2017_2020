temporal_freq: daily

# Variable mapping: raw_name → standardised input_name.
variables:
  PM25: pm25

# Raw publisher artefacts. Paths are relative to {base_path}/raw/grids/.
raw:
  filenames:
    daily_archive: daily-dat/PM25-{year}-{month:02d}.zip
    daily_member: daily-dat/PM25-{year}-{month:02d}/PM25-{year}-{month:02d}-{day:02d}.dat
  grid:
    origin_crs: 4326
    filename: grid.gpkg

# Standardised inputs. Case C per DD-9 / skills/crs.md (centroids in 4326,
# unknown projected CRS): stay in 4326 with regular degree pixel size + resample.
input:
  grid:
    target_crs: 4326
    cell_size: 0.008333         # 1/120° (unit = target_crs's; degrees here, metres if projected)
    bounds:                     # Case C requires explicit bounds (snapped to whole degrees enclosing CONUS).
      xmin: -125.0
      ymin: 24.0
      xmax: -66.0
      ymax: 50.0
    tif:
      dtype: float32
      nodata: nan
      compression: lzw
      tiled: true
      blockxsize: 256
      blockysize: 256

resample: true
resample_method: nearest

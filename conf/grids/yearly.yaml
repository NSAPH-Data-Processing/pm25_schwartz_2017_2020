temporal_freq: yearly

# Variable mapping: raw_name → standardised input_name. One entry per variable.
variables:
  PM25: pm25

# Raw publisher artefacts. Paths are relative to {base_path}/raw/grids/ —
# folders generated by create_dir_paths are guaranteed to exist and are not
# repeated in config.
raw:
  filenames:
    yearly_file: annual-dat/PM25-{year}.dat
  grid:
    origin_crs: 4326           # publisher's distribution CRS
    filename: grid.gpkg

# Standardised inputs produced by standardize_grid.py.
# Case C per DD-9 / skills/crs.md: centroids in 4326, publisher's projected CRS
# is not documented. Stay in 4326 and resample to a regular degree grid (cells
# are small enough at mid-latitudes for the within-cell area bias to be
# negligible per references/crs.md).
input:
  grid:
    target_crs: 4326
    cell_size: 0.008333        # 1/120° (unit = target_crs's; degrees here, metres if projected)
    bounds:                    # Case C requires explicit bounds (snapped to whole degrees enclosing CONUS).
      xmin: -125.0
      ymin: 24.0
      xmax: -66.0
      ymax: 50.0
    tif:
      dtype: float32
      nodata: nan
      compression: lzw
      tiled: true
      blockxsize: 256
      blockysize: 256

# Mismatch policy at standardize_grid. Case C requires resampling (the publisher's
# near-regular 4326 centroids → strict-regular 4326 grid).
resample: true
resample_method: nearest        # bilinear | nearest | average | cubic | lanczos | mode

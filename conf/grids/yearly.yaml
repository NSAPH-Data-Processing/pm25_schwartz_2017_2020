temporal_freq: yearly

# Variable map (DD-15): keyed by the SpaceAgg-standardised name. Each entry
# carries the publisher's raw filename pattern(s) for this cadence.
# Single-variable for Schwartz, but the shape supports multi-variable sources
# (e.g., AQDH's pm25 / no2 / o3). The matrix axis derives from keys at
# Snakefile parse time — one source of truth (DD-14).
variables:
  pm25:
    file: annual-dat/PM25-{year}.dat       # publisher's raw yearly file (relative to {base_path}/raw/grids/)

# Raw publisher artefacts. Paths in `variables.*.file` are relative to
# {base_path}/raw/grids/ — folders generated by create_dir_paths are guaranteed
# to exist and are not repeated in config.
raw:
  grid:
    # origin_crs is inferred from the raw file's declared CRS (DD-14).
    filename: grid.gpkg

# Standardised inputs produced by standardize_grid.py.
# Case C per DD-9 / skills/crs.md: centroids in 4326, publisher's projected CRS
# is not documented. Stay in 4326 and resample to a regular degree grid (cells
# are small enough at mid-latitudes for the within-cell area bias to be
# negligible per references/crs.md).
input:
  grid:
    target_crs: 4326
    cell_size: 0.008333        # 1/120° (unit = target_crs's; degrees here, metres if projected)
    bounds:                    # Case C requires explicit bounds (snapped to whole degrees enclosing CONUS).
      xmin: -125.0
      ymin: 24.0
      xmax: -66.0
      ymax: 50.0
    tif:
      dtype: float32
      nodata: nan
      compression: lzw
      tiled: true
      blockxsize: 256
      blockysize: 256

# Mismatch policy at standardize_grid. Case C requires resampling (the publisher's
# near-regular 4326 centroids → strict-regular 4326 grid).
resample: true
resample_method: nearest        # bilinear | nearest | average | cubic | lanczos | mode
